version: 2
updates:
  # Explicit conventional-commit prefixes (ci(deps): / chore(deps):) rather
  # than whatever Dependabot infers from history: the goreleaser changelog
  # filters on them, and scripts/check-commit-msg.sh enforces the same shape.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      gomod:
        patterns:
          - "*"
