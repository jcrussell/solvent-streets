name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write       # OIDC for cosign keyless signing

jobs:
  smoke:
    name: Smoke-test release binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build snapshot binary
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: latest
          args: build --snapshot --single-target --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-test binary (--version, --help, status)
        run: |
          set -euo pipefail
          bin="$(find "$PWD/dist" -type f -name pvmt -perm -u+x | head -n1)"
          if [ -z "$bin" ]; then
            echo "::error::pvmt binary not found under dist/"
            exit 1
          fi
          echo "Smoke-testing $bin"
          version_out="$("$bin" --version)"
          echo "$version_out"
          # pvmt's --version template is "pvmt {{.Version}}\n" (pkg/cmd/root/root.go).
          # .goreleaser.yaml injects internal/build.Version=v{{.Version}}, which
          # for this snapshot build is v<incpatch>-SNAPSHOT-<shortcommit>. Assert
          # the -SNAPSHOT- suffix, not just a semver: if the ldflags symbol path
          # drifts, internal/build falls back to the module version Go stamps
          # from git (a tag or pseudo-version, never -SNAPSHOT-), so a bare
          # semver check would pass with the ldflags silently ignored.
          if ! echo "$version_out" | grep -qE '^pvmt v[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT-'; then
            echo "::error::--version output '$version_out' lacks the ldflags-injected v<semver>-SNAPSHOT- version — ldflags injection broken?"
            exit 1
          fi
          "$bin" --help > /dev/null
          # Proves the shipped binary decodes a real pvmt.toml, links
          # modernc.org/sqlite under CGO_ENABLED=0 + -trimpath (nothing in
          # ci.yaml builds with release flags), resolves its XDG data dir on a
          # cold machine, and exits 0.
          #
          # Runs against a shipped example rather than a config invented here:
          # the inline one this replaces sat unmaintained for three months
          # while config validation moved on, then blocked a release
          # (solvent-streets-mv2p). examples/livermore-ca is pinned by name in
          # integration/examples_test.go, which also loads every shipped
          # example — so a rename or a new validation rule fails on the PR
          # rather than at tag time.
          #
          # No scratch dir needed: `status` finds pvmt.toml by walking up from
          # cwd (config.FindAndLoad) and opens its SQLite file under the XDG
          # data dir, not cwd (pkg/cmd/factory/default.go) — the checkout stays
          # clean.
          (cd examples/livermore-ca && "$bin" status)

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
