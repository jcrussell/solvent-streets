# Schema version (golangci-lint v2 introduced its v2 config schema).
# The tool-version floor is pinned in .golangci-version and is read
# by .github/workflows/ci.yaml + the Makefile `lint` target so all
# three stay in sync.
version: "2"

run:
  concurrency: 4
  timeout: 5m

linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - depguard
    - dupl
    - dupword
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - intrange
    - makezero
    - mirror
    - misspell
    - modernize
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - predeclared
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    depguard:
      rules:
        main:
          list-mode: lax
          deny:
            # math/rand needs explicit seeding; math/rand/v2 is auto-seeded,
            # so retry jitter differs between invocations.
            - pkg: "math/rand$"
              desc: use math/rand/v2
    errcheck:
      exclude-functions:
        # Close on defers - errors rarely actionable
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (*compress/gzip.Writer).Close
        - (*archive/tar.Writer).Close
        - (*compress/gzip.Reader).Close
        # Print functions - rarely fail
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        # Tabwriter flush
        - (*text/tabwriter.Writer).Flush
        # Cleanup operations - best effort
        - os.Remove
        - os.RemoveAll
        - os.Unsetenv
        # HTTP response writes - errors rarely actionable
        - (net/http.ResponseWriter).Write
    goconst:
      # goconst 1.10 (golangci-lint v2.12) began counting strings inside
      # composite literals. Those are data tables: GeoJSON object shapes,
      # --json field lists, OSM class lookups, tier schedule rows. A value
      # recurring across rows or tables is the table's nature, not a hidden
      # shared concept, and a constant there only renames the literal.
      # Strings code compares or returns (case, ==, return, assignment)
      # are still counted. `call` is the default exclusion and must be
      # restated when the list is set.
      exclude-types:
        - call
        - compositelit
    gocognit:
      min-complexity: 20
    misspell:
      # One spelling across messages and comments: "canceled", as the
      # standard library's context.Canceled prints it.
      extra-words:
        - typo: cancelled
          correction: canceled
        - typo: cancelling
          correction: canceling
    nestif:
      min-complexity: 7
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: indent-error-flow
        - name: if-return
        - name: receiver-naming
        - name: error-naming
        - name: error-return
        - name: increment-decrement
  exclusions:
    presets: []
    # node_modules is npm's tree for the eslint/tsc gate on the template JS.
    # flatted ships a stray .go file that golangci-lint otherwise walks into
    # and reports on; it is not our code and we do not build it.
    paths:
      - node_modules
    rules:
      # Test files: relax noisy linters
      - linters: [bodyclose, gocognit, nestif, dupl, goconst, noctx, usestdlibvars, fatcontext, forcetypeassert, gosec, perfsprint, wastedassign, nakedret, tparallel]
        path: "_test\\.go$"
      # SA5011 in tests: the guard is `if x == nil { t.Fatal(...) }`, which
      # ends the goroutine via runtime.Goexit. staticcheck does model
      # t.Fatal as noreturn, but under golangci-lint that model is not
      # reliably applied: with this exclusion removed (2026-11-05,
      # solvent-streets-cb68) consecutive full runs flagged a different 2-3
      # of the ~120 such guards each time, and a staticcheck-only run
      # flagged none. A blanket exclusion is the price of a deterministic
      # gate; it does hide genuine nil-deref-after-t.Errorf bugs in tests.
      - linters: [staticcheck]
        text: "SA5011"
        path: "_test\\.go$"
      # DB migrations run at startup before context is available
      - linters: [noctx]
        path: "internal/db/"
      # exec.Command is fundamental to CLI tools
      - linters: [gosec]
        text: "G204:"
      # Unhandled errors: errcheck already covers what we care about
      - linters: [gosec]
        text: "G104:"
      # File open by variable path is fundamental to CLI tools
      - linters: [gosec]
        text: "G304:"
      # CLI tool directories are user-local; 0755 is appropriate
      - linters: [gosec]
        text: "G301:"
      # Cache and data files are user-local; 0644 is appropriate
      - linters: [gosec]
        text: "G306:"
      # template.JS is intentional for embedding JSON in HTML templates
      - linters: [gosec]
        text: "G203:"
      # Path traversal via taint: cache paths are derived from request hashes, not user input
      - linters: [gosec]
        text: "G703:"
      # bubbletea-style TUI models use mixed receivers by design
      - linters: [recvcheck]
        path: "internal/tui/"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jcrussell/solvent-streets
  exclusions:
    paths:
      - node_modules

output:
  show-stats: true
