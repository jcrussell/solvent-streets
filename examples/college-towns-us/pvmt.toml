# College Towns — every US town where students are a quarter of residents.
#
# In a college town a small property-tax base carries a street network sized
# for a much larger daytime population: the fiscal squeeze solvent-streets
# measures, at the opposite scale from top-50-cities.
#
# Selection rule: every incorporated place with a population of at least
# 20,000 in which residents enrolled in college or graduate school are at
# least 25% of the total population. That gives 59 places, listed here by
# that share, highest first.
#   - students = B14001_E008 (undergraduate) + B14001_E009 (graduate or
#     professional school); population = B01003_E001. B14001's universe is
#     the population aged 3 and over; the share divides by everyone.
#   - Places only (GEO_ID prefix 1600000US), and only incorporated ones:
#     places the 2023 Gazetteer marks FUNCSTAT S (census-designated places
#     and Puerto Rico's zonas urbanas and comunidades) are excluded. The
#     balance of a consolidated city-county (Athens-Clarke, FUNCSTAT F)
#     counts as incorporated.
#   - Noise guard: a place is dropped if the margin of error of its student
#     count, sqrt(M008² + M009²), exceeds a third of the count. The 20,000
#     floor already removes every such place; the widest remaining MOE is
#     under 12% of its count.
#   - At the 20,000 floor the 20% and 30% cuts give 85 and 40 places; at
#     the 25% cut the 10,000 and 30,000 floors give 89 and 46.
#
# Source: US Census Bureau, American Community Survey 2023 5-year estimates,
# table-based summary file, tables B14001 and B01003 with the Geos20235YR
# geography file, retrieved 2026-11-14 from
#   https://www2.census.gov/programs-surveys/acs/summary_file/2023/table-based-SF/
# and land areas from the 2023 Gazetteer place file
# (https://www2.census.gov/geo/docs/maps-data/data/gazetteer/2023_Gazetteer/).
#
# Names: "City, ST", with the Census type suffix dropped ("Amherst Town
# city" is Amherst, MA; "Athens-Clarke County unified government (balance)"
# is Athens, GA). Every name was checked against Nominatim on 2026-11-14 with
# pvmt's own query, and each resolves to a boundary=administrative polygon
# whose area is within 15% of the Census figure, except Ithaca, pinned
# below. San Marcos, TX is the loosest fit: its OSM boundary is ~15%
# smaller than the Census place.
#
# Grid: 60 m, the finest in the showcase (elsewhere only Cambridge and
# Somerville in greater-boston-ma go this fine). A town whose land area
# would need more than ~12,000 hexes at 60 m gets the finest of 75 m or
# 100 m that fits under that, so no town's compute or hexgrid.geojson runs
# far past a mid-size city's: 75 m for College Station, Gainesville, Auburn,
# Flagstaff and Tuscaloosa, 100 m for Athens-Clarke.
#
# Shared with other examples: Davis (sacramento-ca), Boulder
# (denver-metro-co), Berkeley (bay-area-ca) and Tallahassee
# (state-capitals-us). Each carries the hex_edge_m and growth_rate of that
# example (marked "= <example>"), because examples/all merges it first and a
# different value would be a new merge warning; in examples/all each appears
# under both of its groups. Madison, WI, Lawrence, KS and Charlottesville,
# VA, in an earlier hand-picked version of this list, fall under 25% (18.0%,
# 24.7%, 22.2%) and are out.
#
# Caveats:
#   - ACS counts students where they live while at school, so the share is
#     a resident share, and a big city dilutes even a large campus
#     (Madison is 18.0%).
#   - Urbana and Champaign both host the University of Illinois and both
#     qualify on their own.
#   - A standalone ingest fetches again the four shared towns under this
#     config_id, the same accepted trade as the other rollups.
#   - Forecasts ride the package defaults apart from the low growth rate:
#     no town's PCI or street budget is cited here yet.
#
# To run:
#   cd examples/college-towns-us
#   pvmt all ingest      # 59 Nominatim + 59 Overpass pulls; takes hours
#   pvmt all compute
#   pvmt serve

config_id = "college-towns-us"

[grid]
hex_edge_m = 60

[forecast]
growth_rate = 0.002  # built-out towns that add little new network

[export]
title = "US College Towns"

