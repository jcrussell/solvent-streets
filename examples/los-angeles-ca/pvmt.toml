# Los Angeles County, CA — all 88 incorporated cities, Overpass-only
#
# A county-wide analysis across every incorporated city in Los Angeles
# County, from the City of LA (one of the largest municipal footprints in
# the country) down to tiny enclaves like Vernon, Bradbury, and Rolling
# Hills. This is the SoCal analogue to the bay-area-ca example: a big
# multi-city config whose Compare tab ranks dozens of neighboring
# jurisdictions against one another.
#
# The county has 88 incorporated cities; 87 are listed here. Compton is
# omitted because OpenStreetMap currently has no boundary polygon for it
# (see the note where it would otherwise appear, below).
#
# Techniques demonstrated:
#   - A custom four-tier forecast cost schedule (Failed/Poor/Fair/Good).
#   - Per-city hex_edge_m overrides sized to each jurisdiction: LA proper at
#     300 m, the Antelope Valley cities (Palmdale, Lancaster) at 250 m, and
#     the other large cities at 150-200 m; the many compact cities stay on
#     the 125 m default.
#   - boundary_relation_id for cities Nominatim mis-types as a suburb or
#     returns only as a place node (Industry, La Habra Heights, the Palos
#     Verdes/Rolling Hills enclaves, Rosemead) — the admin boundary is
#     pinned to a specific OSM relation instead.
#
# Mostly a minimal config: most cities run on the top-level [forecast]
# defaults (no per-city PCI/budget). A handful (Los Angeles, Long Beach,
# Pasadena, Glendale, Burbank) keep cited PCI/budget values from earlier
# revisions — see their #@cite comments. Overpass-only. Expect ~87
# Nominatim + Overpass pulls for `pvmt all ingest`.

config_id = "los-angeles-ca"

[grid]
hex_edge_m = 125

[forecast]
years = 20
decay_rate = 0.03

[[forecast.cost_tiers]]
min_pci = 0
max_pci = 25
cost_per_sqm = 200.0
label = "Failed"

[[forecast.cost_tiers]]
min_pci = 25
max_pci = 50
cost_per_sqm = 120.0
label = "Poor"

[[forecast.cost_tiers]]
min_pci = 50
max_pci = 70
cost_per_sqm = 60.0
label = "Fair"

[[forecast.cost_tiers]]
min_pci = 70
max_pci = 100
cost_per_sqm = 15.0
label = "Good"

