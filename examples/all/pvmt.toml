# Combined site — every example unioned into one tagged dashboard.
#
# This is the config `make site` builds. It defines NO cities of its own;
# instead each [[include]] pulls in an existing example's cities and tags them
# at the include site. A city reached through several includes (e.g. San Jose,
# in both the Bay Area metro and the national top-50 list) is merged once and
# accumulates the union of their tags — it appears under every matching group in
# the city selector and in the tag-scoped Compare/Aggregate.
#
# The top-level [grid] and [forecast] are intentionally EMPTY: the include merge
# flattens each example's per-metro calibration (decay/growth/cost tiers, hex
# edge) into fully self-describing per-city overrides, so an empty top-level
# preserves every city's original numbers. Do not add top-level forecast/grid
# values here — they would silently re-calibrate any city that inherited a
# package default. The one exception is forecast.years: it is the config's single
# horizon, not a per-city calibration, and every included example must agree
# with it. None of them sets it, so all cities share the default 30 years.
#
# Include order matters: metros come first, then the national top-50 list,
# then the national category rollups, so a city shared between them keeps
# the most local calibration. Calibration merges
# PER FIELD — the first include to *set* a field wins it, and later includes
# fill only the fields it left unset. That is why Los Angeles keeps the LA
# metro's decay rate and cost tiers while still picking up the national growth
# rate, and why San Diego, Fresno, Sacramento, San Jose and San Francisco keep
# their metro grid tuning *and* the top-50 list's cited PCI and budget figures.
# Later includes also always add their tags.
#
# Where two includes set the same field to different values (11 cities today —
# San Diego, San Francisco, Denver, Boston, Portland, Fresno, Sacramento, Long
# Beach, Oakland, Bakersfield, Aurora; mostly hex_edge_m, a few
# forecast.growth_rate) the load prints one `warning:` line per city naming the
# fields, both values, and both includes. Those warnings are expected here —
# they are how "first wins" stays visible. Reordering the includes below
# changes which calibration those cities get. The rollups add none: every
# city they share with an earlier include carries that include's values
# exactly, as their headers explain.
#
# This config stores no data of its own. Each city keeps the config_id of the
# example that declared it and resolves the same compute settings (hence the
# same snapshot hash), so the union reads the rows and snapshots those examples
# ingested and computed.
#
# Ingest and compute work from here too, and are the cheaper way to rebuild the
# whole site: each city's run writes into the namespace of the example that
# declared it, exactly as running that example would, and a city several
# examples share is fetched once. The duplicate rows those examples' own runs
# would create are not read here.

[export]
title = "Solvent Streets"

[[include]]
path = "../bay-area-ca/pvmt.toml"
tags = ["Bay Area"]

[[include]]
path = "../los-angeles-ca/pvmt.toml"
tags = ["Los Angeles"]

[[include]]
path = "../san-diego-ca/pvmt.toml"
tags = ["San Diego"]

[[include]]
path = "../inland-empire-ca/pvmt.toml"
tags = ["Inland Empire"]

[[include]]
path = "../sacramento-ca/pvmt.toml"
tags = ["Sacramento"]

[[include]]
path = "../central-valley-ca/pvmt.toml"
tags = ["Central Valley"]

[[include]]
path = "../portland-metro-or/pvmt.toml"
tags = ["Portland Metro"]

[[include]]
path = "../denver-metro-co/pvmt.toml"
tags = ["Denver Metro"]

[[include]]
path = "../greater-boston-ma/pvmt.toml"
tags = ["Greater Boston"]

[[include]]
path = "../dfw-metro-tx/pvmt.toml"
tags = ["Dallas-Fort Worth"]

[[include]]
path = "../top-50-cities/pvmt.toml"
tags = ["Top 50"]

[[include]]
path = "../state-capitals-us/pvmt.toml"
tags = ["State Capitals"]

[[include]]
path = "../college-towns-us/pvmt.toml"
tags = ["College Towns"]

[[include]]
path = "../springfields-us/pvmt.toml"
tags = ["Springfields"]

# The showcase ingest takes about a day for every city and is replayed after
# ingest fixes (`pvmt all ingest --rebuild-boundary`), so keep upstream
# responses for 30 days instead of the one-week default. Not hashed: it only
# decides whether a response is re-fetched.
[cache]
ttl = "720h"
