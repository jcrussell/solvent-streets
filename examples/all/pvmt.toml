# Combined site — every example unioned into one tagged dashboard.
#
# This is the config `make site` builds (see CONTRIBUTING.md, "Releasing and
# publishing the showcase"). It declares no cities of its own: each [[include]]
# pulls in an example's cities and tags them at the include site, and the
# cities keep their examples' calibration, config_id and stored data. How
# includes merge, and why the top-level [grid] and [forecast] stay empty, is in
# docs/configuration.md, "Including other configs".
#
# Include order matters, because the first include to set a field wins it:
# metros come first, then the national top-50 list, then the national category
# rollups, so a city shared between them keeps the most local calibration.
# Where two includes set the same field to different values, the load prints
# one expected `warning:` per city naming the field, both values and both
# includes. Reordering the includes changes which calibration those cities get.
# The rollups add no such warning: every city they share with an earlier
# include carries that include's values exactly, as their headers explain.
#
# To run (from this directory; every city, so it takes about a day):
#   pvmt all ingest
#   pvmt all compute
#   pvmt snapshots create <name>
# then `make site` from the repo root.

[export]
title = "Solvent Streets"

[[include]]
path = "../bay-area-ca/pvmt.toml"
tags = ["Bay Area"]

[[include]]
path = "../los-angeles-ca/pvmt.toml"
tags = ["Los Angeles"]

[[include]]
path = "../san-diego-ca/pvmt.toml"
tags = ["San Diego"]

[[include]]
path = "../inland-empire-ca/pvmt.toml"
tags = ["Inland Empire"]

[[include]]
path = "../sacramento-ca/pvmt.toml"
tags = ["Sacramento"]

[[include]]
path = "../central-valley-ca/pvmt.toml"
tags = ["Central Valley"]

[[include]]
path = "../portland-metro-or/pvmt.toml"
tags = ["Portland Metro"]

[[include]]
path = "../denver-metro-co/pvmt.toml"
tags = ["Denver Metro"]

[[include]]
